name: Generate LoC Badge

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Only one workflow may update image-data at a time.
# Do not cancel a running writer halfway through its push.
concurrency:
  group: ${{ github.workflow }}-image-data
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Lines-of-Code Badge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          submodules: recursive

      - name: Make Code Badge
        uses: shadowmoose/GHA-LoC-Badge@1.0.0
        id: badge
        with:
          debug: true
          directory: ./
          badge: ./output/badge.svg
          patterns: "**/*.py|**/*.sh|**/*.md|Makefile"
          ignore: ".venv|venv|env|node_modules|.git"

      - name: Push badge to image-data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Prepare a minimal repository containing only the generated badge.
          rm -rf badge-tmp
          mkdir -p badge-tmp
          cp output/badge.svg badge-tmp/badge.svg
          cd badge-tmp

          git init -b main

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add badge.svg
          git commit -m "chore: update LoC badge"

          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          # Concurrency above prevents normal races between workflow runs.
          # Retry additionally protects against short-lived remote ref-lock races.
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5..."

            if git push --force origin HEAD:image-data; then
              echo "Badge successfully pushed to image-data."
              exit 0
            fi

            if [ "${attempt}" -eq 5 ]; then
              echo "Failed to push badge after 5 attempts." >&2
              exit 1
            fi

            sleep $((attempt * 2))
          done